name: Build S10 FE APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK + RAR extractor
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Extract original PC archive
        run: |
          rm -rf extracted
          mkdir extracted
          bsdtar -xf source/SivilSavunmaSinavPython.rar -C extracted
          test -f extracted/SivilSavunmaSinavPython/main.py
          test -d extracted/SivilSavunmaSinavPython/resources

      - name: Generate Android data from PC resources
        run: |
          python3 tools/prepare_assets.py extracted/SivilSavunmaSinavPython app/src/main/assets/www
          test -s app/src/main/assets/www/data.js
          wc -c app/src/main/assets/www/data.js

      - name: JavaScript syntax check
        run: |
          node --check app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/data.js

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/www/app.js'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'assets/www/data.js'
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sivil-Savunma-S10FE-v5.0-SIFIRDAN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
